<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أذرع المعكرونة</title>
<style>body{font-family:system-ui,Tahoma,sans-serif;background:#1d1b2e;color:#fff;text-align:center;margin:0;padding:12px}canvas{background:#fdf0d5;border-radius:10px;max-width:100%;touch-action:none}a{color:#8ecae6}</style></head><body>
<h2>🍝 أذرع المعكرونة</h2><p>حرّك الماوس لتوصل كوب الشاي إلى الضيف وابقَ هناك ثانيتين. لا تسرع وإلا سينسكب!</p>
<canvas id="cv" width="420" height="320"></canvas><p>التوصيلات: <b id="sc">0</b></p><a href="../">← كل الألعاب</a>
<script>
const c=cv.getContext('2d'),S=[40,160],L=18,N=11;let P,m={x:200,y:160},spill,hold,score=0,tg,msg=0;
function reset(){P=[...Array(N)].map((_,i)=>({x:S[0]+i*L,y:S[1],px:S[0]+i*L,py:S[1]}));spill=0;hold=0;tg={x:250+Math.random()*130,y:50+Math.random()*220}}
cv.onpointermove=e=>{const b=cv.getBoundingClientRect();m={x:(e.clientX-b.left)*420/b.width,y:(e.clientY-b.top)*320/b.height}};
let last=performance.now();
function loop(n){const dt=Math.min((n-last)/1000,.05);last=n;
for(const p of P){const vx=(p.x-p.px)*.97,vy=(p.y-p.py)*.97;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+0.25}
const h=P[N-1];h.x+=(m.x-h.x)*.08;h.y+=(m.y-h.y)*.08;
for(let k=0;k<2;k++){P[0].x=S[0];P[0].y=S[1];for(let i=1;i<N;i++){const a=P[i-1],b=P[i],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-L)/d/2;if(i>1){a.x+=dx*f;a.y+=dy*f}b.x-=dx*f;b.y-=dy*f}}
const sp=Math.hypot(h.x-h.px,h.y-h.py);if(sp>6)spill+=(sp-6)*1.5;spill=Math.max(0,spill-dt*5);
if(Math.hypot(h.x-tg.x,h.y-tg.y)<30){hold+=dt;if(hold>2){score++;msg=1.2;reset()}}else hold=0;
if(spill>=100){msg=-1.5;reset()}
c.clearRect(0,0,420,320);c.font='40px serif';c.textAlign='center';c.textBaseline='middle';c.fillText('🧑',S[0]-12,S[1]);
c.strokeStyle='#ffd6a5';c.lineWidth=12;c.lineCap=c.lineJoin='round';c.beginPath();P.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke();
c.beginPath();c.arc(tg.x,tg.y,30,0,7);c.fillStyle=hold?'#90be6d88':'#0001';c.fill();c.fillText('🧓',tg.x+40,tg.y);c.font='30px serif';c.fillText('🍵',h.x,h.y);
c.fillStyle='#ccc';c.fillRect(10,10,150,12);c.fillStyle='#e63946';c.fillRect(10,10,1.5*Math.min(spill,100),12);c.fillStyle='#333';c.font='12px Tahoma';c.fillText('الانسكاب',85,32);
if(msg){c.font='bold 24px Tahoma';c.fillStyle=msg>0?'#2a9d8f':'#e63946';c.fillText(msg>0?'شكراً! ☺':'انسكب الشاي! 😱',210,290);msg=msg>0?Math.max(0,msg-dt):Math.min(0,msg+dt)}
sc.textContent=score;requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script></body></html>
