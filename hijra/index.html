<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>رحلة النور — الهجرة النبوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#d9b46a;--gold2:#f3d99a;--ink:#f4ead2;--bg:rgba(18,12,6,.86)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Tajawal,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
/* cards */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.75))}
.card{max-width:620px;width:100%;max-height:calc(100% - 20px);overflow:auto;background:var(--bg);border:1px solid rgba(217,180,106,.55);border-radius:18px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 4px rgba(217,180,106,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:pop .45s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.card .num{color:var(--gold);font-size:13px;letter-spacing:.5px;font-weight:700;margin-bottom:4px}
.card h1{font-family:Amiri,serif;font-size:38px;margin:0 0 6px;color:var(--gold2);line-height:1.3}
.card h2{font-family:Amiri,serif;font-size:28px;margin:0 0 10px;color:var(--gold2);line-height:1.3}
.card p{font-size:16.5px;line-height:1.9;margin:0 0 10px;color:#efe3c6}
.card .verse{font-family:Amiri,serif;font-size:21px;color:var(--gold2);text-align:center;margin:10px 0 14px;line-height:1.8}
.card .obj{background:rgba(217,180,106,.12);border-right:3px solid var(--gold);padding:10px 12px;border-radius:8px;margin:12px 0;font-weight:700;font-size:15.5px}
.card .note{font-size:13px;opacity:.7;line-height:1.7}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button.b{font-family:inherit;font-size:17px;font-weight:700;padding:12px 22px;border-radius:12px;border:0;cursor:pointer;background:linear-gradient(180deg,#e9c77f,#b98d3e);color:#2a1a06;box-shadow:0 4px 0 #7d5a22}
button.b:active{transform:translateY(2px);box-shadow:0 2px 0 #7d5a22}
button.b.ghost{background:transparent;color:var(--gold2);border:1px solid rgba(217,180,106,.5);box-shadow:none}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.stages button{font-family:inherit;font-size:14px;padding:9px;border-radius:10px;border:1px solid rgba(217,180,106,.35);background:rgba(217,180,106,.08);color:var(--ink);cursor:pointer;text-align:right}
.ctrl{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;opacity:.85;margin-top:8px}
.ctrl b{color:var(--gold2)}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hStage{position:absolute;top:12px;left:12px;font-size:13px;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:10px;color:var(--gold2);direction:rtl}
#hObj{position:absolute;top:12px;right:12px;max-width:min(46vw,360px);font-size:14.5px;font-weight:700;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:10px;border-right:3px solid var(--gold);line-height:1.6}
#hTop{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#hTimer{font-size:22px;font-weight:900;background:rgba(0,0,0,.5);padding:3px 14px;border-radius:10px;font-variant-numeric:tabular-nums;direction:ltr}
#hTimer.low{color:#ff8a6a}
#hMeter{width:150px;background:rgba(0,0,0,.5);border-radius:8px;padding:4px 6px;font-size:11.5px;text-align:center}
#hMeter .bar{height:7px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:3px;direction:ltr}
#hMeter .fill{height:100%;width:0;background:linear-gradient(90deg,#ffcf5a,#ff3b2f)}
#hArrow{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);padding:3px 10px;border-radius:12px;font-size:12px}
#hArrow svg{width:22px;height:22px;transition:transform .08s linear}
#toast{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);max-width:min(92vw,620px);background:rgba(18,12,6,.82);border:1px solid rgba(217,180,106,.4);padding:10px 16px;border-radius:12px;font-size:16px;line-height:1.8;text-align:center;opacity:0;transition:opacity .4s}
#toast.on{opacity:1}
#sub{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);width:min(92vw,700px);text-align:center;font-family:Amiri,serif;font-size:23px;line-height:1.8;color:#fff6dc;text-shadow:0 2px 8px #000,0 0 2px #000;opacity:0;transition:opacity .6s}
#sub.on{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;transition:opacity .8s}
#vign{position:fixed;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 0 0 rgba(255,0,0,0);transition:box-shadow .2s}
/* touch */
#touchUI{position:fixed;inset:0;z-index:11;pointer-events:none}
#joyBase{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);transform:translate(-50%,-50%);display:none}
#joyKnob{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(233,199,127,.75);left:50%;top:50%;transform:translate(-50%,-50%)}
#tHint{position:absolute;bottom:14px;width:100%;display:flex;justify-content:space-between;padding:0 18px;font-size:12px;opacity:.6;direction:ltr}
#pauseBtn{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:12;font-family:inherit;background:rgba(0,0,0,.45);color:var(--gold2);border:1px solid rgba(217,180,106,.4);border-radius:10px;padding:5px 12px;font-size:13px}
@media (max-width:600px){#hStage{display:none}#hTop{left:10px;transform:none;align-items:flex-start}#hMeter{width:120px}.card h1{font-size:30px}.card p{font-size:15.5px}#hObj{font-size:13px}#sub{font-size:19px}}
</style>

<body>
<canvas id="c"></canvas>
<div id="vign"></div>
<div id="flash"></div>
<div id="hud" class="hidden">
  <div id="hStage"></div>
  <div id="hObj"></div>
  <div id="hTop">
    <div id="hTimer" class="hidden"></div>
    <div id="hMeter" class="hidden"><span id="hMeterLbl"></span><div class="bar"><div class="fill" id="hMeterFill"></div></div></div>

  <div id="toast"></div>

</div>
<div id="touchUI" class="hidden"><div id="joyBase"><div id="joyKnob"></div></div><div id="tHint"><span>◀ اسحب هنا للمشي</span><span>اسحب هنا للنظر ▶</span></div></div>
<button id="pauseBtn" class="hidden">❚❚ إيقاف</button>
<div id="overlay"><div class="card"><h2>جارٍ التحميل…</h2></div></div>

<script type="module">
import * as THREE from 'three';

/* ================= core ================= */
const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 2000);
camera.rotation.order = 'YXZ';
scene.add(camera);
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const hemi = new THREE.HemisphereLight(0xffffff, 0x886644, .8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.2); scene.add(sun);
const amb = new THREE.AmbientLight(0xffffff, 0); scene.add(amb);
function env(o){
  scene.background = new THREE.Color(o.sky);
  scene.fog = new THREE.Fog(o.fog ?? o.sky, o.near ?? 40, o.far ?? 300);
  hemi.color.set(o.hs ?? 0xffffff); hemi.groundColor.set(o.hg ?? 0x886644); hemi.intensity = o.hi ?? .8;
  sun.color.set(o.sc ?? 0xffffff); sun.intensity = o.si ?? 1.2; sun.position.set(...(o.sp ?? [50,100,30]));
  amb.intensity = o.ai ?? 0;
}

// materials
const matCache = new Map();
function mat(c, extra){
  if(extra) return new THREE.MeshLambertMaterial(Object.assign({color:c, flatShading:true}, extra));
  if(!matCache.has(c)) matCache.set(c, new THREE.MeshLambertMaterial({color:c, flatShading:true}));
  return matCache.get(c);
}
function glow(c, op=1){ return new THREE.MeshBasicMaterial({color:c, transparent:op<1, opacity:op, fog:false}); }

// seeded random
let seed = 1;
function rnd(){ seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }
const R = (a,b) => a + (b-a)*rnd();
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function wrapA(a){ while(a>Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; }
function lerpA(a,b,t){ return a + wrapA(b-a)*t; }

/* ================= world state ================= */
let world = new THREE.Group(); scene.add(world);
let colliders = [];
let bounds = {minX:-50,maxX:50,minZ:-50,maxZ:50};
let groundH = () => 0;
let guards = [];
const P = {x:0, z:0, yaw:0, pitch:0, eye:1.65, bob:0, speedMul:1};

function clearWorld(){
  scene.remove(world);
  world.traverse(o => { if(o.geometry) o.geometry.dispose(); if(o.material){ const ms = Array.isArray(o.material)?o.material:[o.material]; ms.forEach(m=>{ if(m.map) m.map.dispose(); if(![...matCache.values()].includes(m)) m.dispose(); }); } });
  world = new THREE.Group(); scene.add(world);
  colliders = []; guards = []; groundH = () => 0;
  [...camera.children].forEach(c => camera.remove(c));
}
function addBox(x,z,w,d){ colliders.push({x,z,hw:w/2,hd:d/2}); }
function addCircle(x,z,r){ colliders.push({x,z,r}); }
function blocked(x,z,r=.35){
  if(x<bounds.minX||x>bounds.maxX||z<bounds.minZ||z>bounds.maxZ) return true;
  for(const c of colliders){
    if(c.r!==undefined){ const dx=x-c.x, dz=z-c.z; if(dx*dx+dz*dz < (c.r+r)*(c.r+r)) return true; }
    else if(Math.abs(x-c.x) < c.hw+r && Math.abs(z-c.z) < c.hd+r) return true;
  }
  return false;
}
function segHitsBox(x1,z1,x2,z2,b){
  let tmin=0, tmax=1;
  const ax=[[x1,x2-x1,b.x-b.hw,b.x+b.hw],[z1,z2-z1,b.z-b.hd,b.z+b.hd]];
  for(const [p,d,lo,hi] of ax){
    if(Math.abs(d)<1e-9){ if(p<lo||p>hi) return false; }
    else { let t1=(lo-p)/d, t2=(hi-p)/d; if(t1>t2) [t1,t2]=[t2,t1]; tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2); if(tmin>tmax) return false; }
  }
  return true;
}
function lineOfSight(x1,z1,x2,z2){ for(const c of colliders){ if(c.r===undefined && !c.seeThrough && segHitsBox(x1,z1,x2,z2,c)) return false; } return true; }

/* ================= builders ================= */
function box(w,h,d,c,x=0,y=0,z=0,parent=world){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), typeof c==='number'?mat(c):c); m.position.set(x,y,z); parent.add(m); return m; }

function figure(robe=0xe8dcc0, wrap=0xffffff, scale=1){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.22,.42,1.35,7), mat(robe)); body.position.y=.68; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.17,8,6), mat(0x9a7350)); head.position.y=1.52; g.add(head);
  const cloth = new THREE.Mesh(new THREE.SphereGeometry(.205,8,6,0,Math.PI*2,0,Math.PI*.58), mat(wrap)); cloth.position.y=1.54; g.add(cloth);
  const shawl = new THREE.Mesh(new THREE.ConeGeometry(.3,.45,7), mat(wrap)); shawl.position.y=1.27; g.add(shawl);
  const arms = [];
  for(const s of [-1,1]){
    const piv = new THREE.Group(); piv.position.set(.27*s,1.25,0);
    const a = new THREE.Mesh(new THREE.CylinderGeometry(.07,.08,.62,5), mat(robe)); a.position.y=-.3; piv.add(a);
    piv.rotation.z = .12*s; g.add(piv); arms.push(piv);
  }
  g.scale.setScalar(scale);
  g.userData = {arms, body};
  return g;
}
function camel(color=0xc19a6b, saddle=0x8a2b20){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(1,10,8), mat(color)); body.scale.set(.62,.58,1.25); body.position.y=1.75; g.add(body);
  const hump = new THREE.Mesh(new THREE.SphereGeometry(.5,8,6), mat(color)); hump.scale.set(1,.85,1.2); hump.position.set(0,2.25,-.1); g.add(hump);
  const blanket = new THREE.Mesh(new THREE.BoxGeometry(1.3,.08,1.1), mat(saddle)); blanket.position.set(0,2.55,-.1); blanket.rotation.x=.05; g.add(blanket);
  for(const s of [-1,1]){ const bag=new THREE.Mesh(new THREE.BoxGeometry(.25,.5,.6), mat(0x6b4a2a)); bag.position.set(.66*s,2.05,-.2); g.add(bag); }
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.17,.26,1.4,6), mat(color)); neck.position.set(0,2.25,1.35); neck.rotation.x=.75; g.add(neck);
  const head = new THREE.Mesh(new THREE.BoxGeometry(.26,.28,.62), mat(color)); head.position.set(0,2.75,1.95); g.add(head);
  const legs = [];
  for(const [x,z] of [[-.32,.75],[.32,.75],[-.32,-.75],[.32,-.75]]){
    const piv = new THREE.Group(); piv.position.set(x,1.5,z);
    const l = new THREE.Mesh(new THREE.CylinderGeometry(.09,.11,1.5,5), mat(color)); l.position.y=-.75; piv.add(l);
    g.add(piv); legs.push(piv);
  }
  g.userData = {legs};
  return g;
}
function horse(color=0x4a2e1c){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(1,10,8), mat(color)); body.scale.set(.45,.5,1.05); body.position.y=1.45; g.add(body);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.16,.28,1,6), mat(color)); neck.position.set(0,1.95,.95); neck.rotation.x=.55; g.add(neck);
  const head = new THREE.Mesh(new THREE.BoxGeometry(.24,.28,.6), mat(color)); head.position.set(0,2.3,1.35); head.rotation.x=.5; g.add(head);
  const legs=[];
  for(const [x,z] of [[-.22,.6],[.22,.6],[-.22,-.6],[.22,-.6]]){
    const piv=new THREE.Group(); piv.position.set(x,1.15,z);
    const l=new THREE.Mesh(new THREE.CylinderGeometry(.07,.08,1.15,5), mat(color)); l.position.y=-.57; piv.add(l); g.add(piv); legs.push(piv);
  }
  const rider = figure(0x5a3b2a, 0x2a2a2a, .9); rider.position.set(0,1.45,-.1); g.add(rider);
  g.userData={legs};
  return g;
}
function sheep(){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.SphereGeometry(.42,8,6), mat(0xf1ece0)); b.scale.set(.8,.75,1.1); b.position.y=.62; g.add(b);
  const h=new THREE.Mesh(new THREE.BoxGeometry(.2,.22,.3), mat(0x2d241c)); h.position.set(0,.78,.48); g.add(h);
  for(const [x,z] of [[-.15,.22],[.15,.22],[-.15,-.22],[.15,-.22]]) box(.07,.4,.07,0x2d241c,x,.2,z,g);
  return g;
}
function palm(x,z,h=6.5,parent=world){
  const g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.18,.3,h,6), mat(0x86643e)); t.position.y=h/2; t.rotation.z=R(-.08,.08); g.add(t);
  const top=new THREE.Group(); top.position.y=h; g.add(top);
  const n=8;
  for(let i=0;i<n;i++){
    const piv=new THREE.Group(); piv.rotation.y=i/n*Math.PI*2+R(0,.4);
    const f=new THREE.Mesh(new THREE.ConeGeometry(.42,3,4), mat(i%2?0x4f7a2e:0x5d8a35)); f.scale.z=.18;
    f.rotation.x=Math.PI/2+.55; f.position.set(0,-.35,1.3); piv.add(f); top.add(piv);
  }
  g.position.set(x,groundH(x,z),z); parent.add(g); addCircle(x,z,.4);
  return g;
}
function house(x,z,w,d,h,c,parent=world){
  const g=new THREE.Group(); g.position.set(x,groundH(x,z),z);
  box(w,h,d,c,0,h/2,0,g);
  box(w+.2,.35,d+.2,shade(c,.88),0,h+.17,0,g);
  const win = mat(0x2a1d12);
  for(const s of [-1,1]){
    if(rnd()<.7) box(.8,.9,.06,win,R(-w/4,w/4),h*.62,s*(d/2+.02),g);
    if(rnd()<.6) box(.06,.9,.8,win,s*(w/2+.02),h*.62,R(-d/4,d/4),g);
  }
  parent.add(g); addBox(x,z,w,d);
  return g;
}
function shade(c,f){ const col=new THREE.Color(c); col.multiplyScalar(f); return col.getHex(); }

function makeTerrain(size, seg, hfn, colFn){
  const geo = new THREE.PlaneGeometry(size,size,seg,seg); geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position; const cols = [];
  const col = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i), y=hfn(x,z); pos.setY(i,y);
    colFn(x,z,y,col); cols.push(col.r,col.g,col.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols,3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({vertexColors:true, flatShading:true}));
  world.add(m); return m;
}
function flatGround(size, c, y=0){ const m=new THREE.Mesh(new THREE.PlaneGeometry(size,size), mat(c)); m.rotation.x=-Math.PI/2; m.position.y=y; world.add(m); return m; }
function mountainsRing(r1,r2,n,cols,hmin=25,hmax=60){
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+R(0,.2), r=R(r1,r2), h=R(hmin,hmax);
    const m=new THREE.Mesh(new THREE.ConeGeometry(R(h*.9,h*1.6),h,R(5,8)|0), mat(cols[i%cols.length]));
    m.position.set(Math.cos(a)*r, h/2-2, Math.sin(a)*r); m.rotation.y=R(0,3); world.add(m);
  }
}
function stars(n=1400){
  const g=new THREE.BufferGeometry(); const p=[];
  for(let i=0;i<n;i++){ const u=rnd()*Math.PI*2, v=Math.acos(R(.05,1)); const r=800; p.push(Math.sin(v)*Math.cos(u)*r, Math.cos(v)*r, Math.sin(v)*Math.sin(u)*r); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(p,3));
  const s=new THREE.Points(g, new THREE.PointsMaterial({color:0xffffff, size:1.6, sizeAttenuation:false, fog:false}));
  world.add(s); return s;
}
function moon(x,y,z,r=18){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14), glow(0xfff6d8)); m.position.set(x,y,z); world.add(m); return m; }

function label(text, size=1, color='#fff3d6', bg='rgba(20,12,4,.7)'){
  const c=document.createElement('canvas'); const ctx=c.getContext('2d'); const fs=56;
  ctx.font=`700 ${fs}px Tajawal, sans-serif`;
  const w=Math.ceil(ctx.measureText(text).width)+48; c.width=w; c.height=fs+34;
  ctx.font=`700 ${fs}px Tajawal, sans-serif`; ctx.direction='rtl'; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(bg){ ctx.fillStyle=bg; const r=22; ctx.beginPath(); ctx.moveTo(r,0); ctx.arcTo(w,0,w,c.height,r); ctx.arcTo(w,c.height,0,c.height,r); ctx.arcTo(0,c.height,0,0,r); ctx.arcTo(0,0,w,0,r); ctx.fill(); }
  ctx.fillStyle=color; ctx.fillText(text, w/2, c.height/2+3);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false, fog:false}));
  const k=size*.9; s.scale.set(k*w/c.height, k, 1);
  return s;
}
function beacon(x,z,text,color=0xffd27a){
  const g=new THREE.Group(); const y=groundH(x,z); g.position.set(x,y,z);
  const col=new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,40,16,1,true), new THREE.MeshBasicMaterial({color, transparent:true, opacity:.22, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, fog:false}));
  col.position.y=20; g.add(col);

/* ---- guards ---- */
function coneMesh(Rr, fov, color){
  const n=18, pts=[0,0,0];
  for(let i=0;i<=n;i++){ const a=-fov/2+fov*i/n; pts.push(Math.sin(a)*Rr,0,Math.cos(a)*Rr); }
  const idx=[]; for(let i=1;i<=n;i++) idx.push(0,i,i+1);
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3)); g.setIndex(idx);
  const m=new THREE.Mesh(g, new THREE.MeshBasicMaterial({color, transparent:true, opacity:.22, depthWrite:false, side:THREE.DoubleSide, fog:false}));
  m.position.y=.12; return m;
}
function makeGuard(path, o={}){
  const Rr=o.R??13, fov=o.fov??1.25, base=o.torch?0xffb347:0xffe08a;
  const g=new THREE.Group();
  const fig=figure(o.robe??0x6e2a1c, o.wrap??0x2b2320); g.add(fig);
  const spear=box(.04,2.4,.04,0x5a3b22,.42,1.2,.15,g);
  const cone=coneMesh(Rr,fov,base); g.add(cone);
  let flame=null;
  if(o.torch){
    box(.06,.6,.06,0x3a2a1a,-.38,1.35,.3,g);
    flame=new THREE.Mesh(new THREE.SphereGeometry(.13,6,5), glow(0xffa53a)); flame.position.set(-.38,1.72,.3); g.add(flame);
    if(o.light){ const pl=new THREE.PointLight(0xff9a40, 6, 14, 1.6); pl.position.set(-.38,1.9,.3); g.add(pl); }
  }
  world.add(g);
  const p0=path[0];
  const G={g, fig, cone, flame, base, path, i:path.length>1?1:0, x:p0[0], z:p0[1], heading:o.heading??0, wait:o.startWait??0, scan:0, R:Rr, fov, speed:o.speed??2.1, t:R(0,6), active:true};
  g.position.set(G.x, groundH(G.x,G.z), G.z); g.rotation.y=G.heading;
  guards.push(G); return G;
}
function updateGuards(dt){
  let worst=0;
  for(const G of guards){
    if(!G.active) continue;
    G.t+=dt;
    if(G.wait>0){
      G.wait-=dt; G.scan+=dt;
      G.g.rotation.y = lerpA(G.g.rotation.y, G.heading + Math.sin(G.scan*1.3)*.75, 1-Math.exp(-4*dt));
    } else if(G.path.length>1){
      const tp=G.path[G.i]; const dx=tp[0]-G.x, dz=tp[1]-G.z, d=Math.hypot(dx,dz);
      if(d<.15){ G.heading = tp[2]!==undefined && tp[2]!==null ? tp[2] : G.g.rotation.y; G.wait=tp[3]??1.6; G.scan=0; G.i=(G.i+1)%G.path.length; }
      else { const s=Math.min(d,G.speed*dt); G.x+=dx/d*s; G.z+=dz/d*s; G.heading=Math.atan2(dx,dz); G.g.rotation.y=lerpA(G.g.rotation.y,G.heading,1-Math.exp(-7*dt)); G.fig.position.y=Math.abs(Math.sin(G.t*7))*.05; }
      G.g.position.set(G.x, groundH(G.x,G.z), G.z);
    }
    if(G.flame) G.flame.scale.setScalar(1+Math.sin(G.t*20)*.15);
    const px=P.x-G.x, pz=P.z-G.z, dist=Math.hypot(px,pz);
    let seen=false;
    if(dist<G.R){
      const a=wrapA(Math.atan2(px,pz)-G.g.rotation.y);
      if(Math.abs(a)<G.fov/2 || dist<1.8) seen = lineOfSight(G.x,G.z,P.x,P.z);
    }
    G.cone.material.color.set(seen?0xff2a1a:G.base); G.cone.material.opacity = seen?.38:.22;
    if(seen) worst=Math.max(worst, 1-dist/G.R*.6);
  }
  return worst;
}

function movePlayer(dt){
  let f=0, s=0;
  if(keys.KeyW||keys.ArrowUp) f+=1; if(keys.KeyS||keys.ArrowDown) f-=1;
  if(keys.KeyD||keys.ArrowRight) s+=1; if(keys.KeyA||keys.ArrowLeft) s-=1;
  f += -joy.y; s += joy.x;
  const mag=Math.hypot(f,s); if(mag>1){ f/=mag; s/=mag; }
  const run = keys.ShiftLeft||keys.ShiftRight|| Math.hypot(joy.x,joy.y)>.92;
  const sp = (run?7:4.2)*P.speedMul;
  const fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw), rx=Math.cos(P.yaw), rz=-Math.sin(P.yaw);
  const vx=(fx*f+rx*s)*sp*dt, vz=(fz*f+rz*s)*sp*dt;
  // slope slowdown
  if(vx||vz){
    const h0=groundH(P.x,P.z), h1=groundH(P.x+vx,P.z+vz); const slope=(h1-h0)/Math.max(.001,Math.hypot(vx,vz));
    const k = slope>0 ? clamp(1-slope*.35,.45,1) : 1;
    if(!blocked(P.x+vx*k,P.z)) P.x+=vx*k;
    if(!blocked(P.x,P.z+vz*k)) P.z+=vz*k;
    P.bob += Math.hypot(vx,vz)*(run?1.6:2.2);
  }
  return Math.hypot(vx,vz)/Math.max(dt,1e-4);
}
function applyCamera(){
  camera.position.set(P.x, groundH(P.x,P.z)+P.eye+Math.sin(P.bob)*.04, P.z);
  camera.rotation.set(P.pitch, P.yaw, 0);
}
function lookAtPoint(x,z){ P.yaw=Math.atan2(-(x-P.x), -(z-P.z)); P.pitch=0; }

let S=null, stageIdx=0, time=0;

  hideCard(); state='play'; hud.classList.remove('hidden');
  $('pauseBtn').classList.remove('hidden');
  if(isTouch) $('touchUI').classList.remove('hidden');
}
function loadStage(i, skipIntro=false){
  stageIdx=i; const def=STAGES[i];
  clearWorld(); seed = 1000+i*77;
  P.pitch=0; P.speedMul=1; P.eye=1.65;
  S = { def, timer:null, meter:null, target:null, t:0, done:false };
  toastT=subT=0; $('toast').classList.remove('on'); $('sub').classList.remove('on');
  def.build(S);
  $('hStage').textContent = `المرحلة ${i+1} من ${STAGES.length} — ${def.title}`;
  setObj(S.obj||'');
  hudRefresh();
  applyCamera();
  if(skipIntro){ startPlay(); return; }
  state='card'; hud.classList.add('hidden'); $('touchUI').classList.add('hidden'); $('pauseBtn').classList.add('hidden');
  card(`<div class="num">المرحلة ${i+1} من ${STAGES.length}</div><h1>${def.title}</h1>${def.intro}<div class="obj">🎯 ${def.goal}</div>`,
    [{label:'ابدأ', fn:startPlay}]);
}
function hudRefresh(){

}
function winStage(html){
  if(S.done) return; S.done=true; state='card';
  $('touchUI').classList.add('hidden'); $('pauseBtn').classList.add('hidden');
  const last = stageIdx===STAGES.length-1;
  card(`<div class="num">أتممتَ المرحلة ${stageIdx+1}</div>${html}`, [{label: last?'الخاتمة':'المرحلة التالية ←', fn:()=> last?ending():loadStage(stageIdx+1)}]);
}
function failStage(reason){
  if(S.done) return; S.done=true; state='card';
  $('touchUI').classList.add('hidden'); $('pauseBtn').classList.add('hidden');
  card(`<h2>لم تكتمل المهمة</h2><p>${reason}</p>`, [{label:'حاول مرة أخرى', fn:()=>loadStage(stageIdx,true)}, {label:'قصة المرحلة', ghost:true, fn:()=>loadStage(stageIdx)}]);

  const kaaba=box(4.4,5.4,4.4,0x121212,0,2.7,0); box(4.46,.5,4.46,0xc7a046,0,4.1,0);

  const special={};
  for(let gx=-4;gx<=4;gx++) for(let gz=-4;gz<=4;gz++){
    if(Math.abs(gx)<=1&&Math.abs(gz)<=1) continue;
    const x=gx*ST, z=gz*ST;
    if(gx===-4&&gz===4){ special.nabi=house(x,z,7.6,7.6,4.6,night?0x8a7a66:0xd9c8a6); const l=label('دار النبي ﷺ',1); l.position.set(x,7,z); world.add(l); continue; }

    if(rnd()<.12) { if(rnd()<.6) palm(x+R(-2,2),z+R(-2,2),R(5,7)); continue; }
    house(x+R(-.6,.6), z+R(-.6,.6), R(5.6,7.8), R(5.6,7.8), R(3,6.2), cols[(rnd()*cols.length)|0]);
  }
  // outer wall line so the city edge reads
  bounds={minX:-51.5,maxX:51.5,minZ:-51.5,maxZ:51.5};
  if(night){ stars(); moon(-220,260,-380,16); }
}

    function nearPath(x,z){ let best=1e9; for(const [a,b] of segs){ const vx=b[0]-a[0], vz=b[1]-a[1], l=vx*vx+vz*vz; const tt=clamp(((x-a[0])*vx+(z-a[1])*vz)/l,0,1); const d=Math.hypot(x-a[0]-vx*tt,z-a[1]-vz*tt); best=Math.min(best,d);} return best; }
    for(let i=0;i<120;i++){ const x=R(-60,60), z=R(-110,55); const d=nearPath(x,z); if(d<9) continue; if(d<26) house(x,z,R(5,8),R(5,8),R(3,5.5),cols[i%4]); else if(rnd()<.6) palm(x,z,R(5,8)); }
    for(let i=0;i<40;i++){ const x=R(-90,90), z=R(-140,70); if(nearPath(x,z)<14) continue; palm(x,z,R(5,8.5)); }
    // crowd
    const crowd=[];
    for(let i=0;i<110;i++){
      const si=(rnd()*segs.length)|0; const [a,b]=segs[si]; const tt=rnd(); const px=a[0]+(b[0]-a[0])*tt, pz=a[1]+(b[1]-a[1])*tt;
      const vx=b[0]-a[0], vz=b[1]-a[1], l=Math.hypot(vx,vz); const nx=-vz/l, nz=vx/l; const side=rnd()<.5?-1:1; const off=R(4.2,7.5)*side;
      const x=px+nx*off, z=pz+nz*off; if(nearPath(x,z)<3.8) continue;
      const kid=rnd()<.3; const f=figure([0xf2ead8,0xe0d2b6,0x8a5a3a,0x5a6a8a,0x9a4a3a,0xd8c8a0,0x6a7a4a][(rnd()*7)|0], [0xffffff,0xe8e0d0,0x2a2a2a][(rnd()*3)|0], kid?R(.6,.72):R(.92,1.06));
      f.position.set(x,0,z); world.add(f);
      let daf=null; if(rnd()<.18){ daf=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.06,14), mat(0xd8c098)); daf.rotation.x=Math.PI/2; daf.position.set(0,1.45,.35); f.add(daf); }
      crowd.push({f,x,z,t:R(0,6),kid,daf,cheer:R(.5,1.5)});
    }
    // rooftop people
    // camel
    const nq=camel(0xd2b082,0x2a6a3a); world.add(nq);
    const ql=label('القصواء',.8); ql.position.y=4; nq.add(ql);
    const C={x:way[0][0],z:way[0][1],i:1,t:0,kneel:0};
    bounds={minX:-70,maxX:70,minZ:-125,maxZ:60};
    P.x=-2.2; P.z=46; lookAtPoint(0,30);
    S.meter=0; S.meterLbl='ابتعادك عن الناقة';
    S.obj='🎯 امشِ مع <b>القصواء</b>';
    const lines=['طلع البدرُ علينا','من ثنيّات الوداع','وجب الشكرُ علينا','ما دعا لله داع'];
    let li=0, lt=2, floats=[];
    const spot=way[way.length-1];
    S.update=(dt,t)=>{
      C.t+=dt;
      const dP=Math.hypot(P.x-C.x,P.z-C.z);
      if(C.i<way.length){ const pace = dP>16 ? .3 : 2.4; const [tx,tz]=way[C.i]; const dx=tx-C.x, dz=tz-C.z, d=Math.hypot(dx,dz); if(d<.4) C.i++; else { const s=Math.min(d,pace*dt); C.x+=dx/d*s; C.z+=dz/d*s; nq.rotation.y=lerpA(nq.rotation.y,Math.atan2(dx,dz),dt*3); }
        nq.userData.legs.forEach((l,j)=>l.rotation.x=Math.sin(C.t*3.5+j*1.6)*.28*(pace>1?1:.2)); nq.position.set(C.x,0,C.z); }
      else { // kneel
        C.kneel=Math.min(1,C.kneel+dt*.5); nq.position.y=-C.kneel*.9; nq.userData.legs.forEach((l,j)=>l.rotation.x=(j<2?1:-1)*C.kneel*1.2);
        if(C.kneel>=1 && !S.endT){ S.endT=t; flash(); sub('بركت الناقة… هنا موضع المسجد النبوي الشريف',5000); }
        if(S.endT && t-S.endT>4.5) winStage(`<h2>طلع البدرُ علينا</h2>
          <p>بركت القصواء في مِربدٍ لغلامين يتيمين من بني النجار، أمام دار <b>أبي أيوب الأنصاري</b>، فقال ﷺ: «هذا إن شاء الله المنزل». فحمل أبو أيوب رَحْله إلى بيته، ونزل النبي ﷺ عنده.</p>
          <p>واشترى ﷺ الأرض من الغلامين، وبنى فيها <b>المسجد النبوي</b>، وآخى بين المهاجرين والأنصار، وقامت أول دولة للإسلام.</p>`);
      }
      S.target={x:C.x,z:C.z};
      S.meter=clamp(S.meter+(dP>16?dt/7:-dt/5),0,1);
      if(S.meter>=1) return failStage('ابتعدتَ عن الناقة وسط الزحام. ابقَ قريباً منها.');
      // crowd anim
      for(const c of crowd){ c.t+=dt; const dd=Math.hypot(P.x-c.x,P.z-c.z); const ex = dd<14 ? 1 : .35;
        c.f.position.y=Math.abs(Math.sin(c.t*4*c.cheer))*.18*ex*(c.kid?1.6:1);
        c.f.rotation.y=lerpA(c.f.rotation.y, Math.atan2(C.x-c.x,C.z-c.z), dt*2);
        const ar=c.f.userData.arms; ar[0].rotation.z=-.12-(Math.sin(c.t*5*c.cheer)*.5+.9)*ex*1.4; ar[1].rotation.z=.12+(Math.sin(c.t*5*c.cheer+1)*.5+.9)*ex*1.4;
        if(c.daf) c.daf.position.y=1.45+Math.sin(c.t*12)*.04;
      }
      // floating song lines
      lt-=dt; if(lt<=0){ lt=3.2; const s=label(lines[li%4],1.3,'#fff6dc','rgba(30,20,10,.4)'); s.position.set(P.x-Math.sin(P.yaw)*16+R(-5,5), 6, P.z-Math.cos(P.yaw)*16+R(-3,3)); world.add(s); floats.push({s,t:0}); if(li<4) sub(lines[li%4],2800); li++; }
      floats=floats.filter(f=>{ f.t+=dt; f.s.position.y+=dt*.8; f.s.material.opacity=Math.max(0,1-f.t/6); if(f.t>6){ world.remove(f.s); f.s.material.map.dispose(); f.s.material.dispose(); return false;} return true; });
    };
  }
},
];
function lerp(a,b,t){ return a+(b-a)*Math.min(1,t); }

/* ================= title / ending ================= */
function titleScreen(){
  state='title'; hud.classList.add('hidden'); $('touchUI').classList.add('hidden'); $('pauseBtn').classList.add('hidden');
  clearWorld(); seed=7;
  env({sky:0x0b1226, near:30, far:300, hs:0x6d7fb8, hg:0x1a1410, hi:.55, sc:0x9fb4ff, si:.45, sp:[-60,90,-80], ai:.12});
  buildMecca(true);
  P.x=0; P.z=60; P.eye=14; P.pitch=-.12; lookAtPoint(0,0); P.pitch=-.12;
  S={update:(dt,t)=>{ P.yaw+=dt*.04; P.x=Math.sin(t*.04)*60; P.z=Math.cos(t*.04)*60; P.yaw=Math.atan2(-(0-P.x),-(0-P.z)); }};
  const ctrls = isTouch
    ? `<div class="ctrl"><span><b>إصبع يسار الشاشة</b>: المشي (ادفع لآخرها للجري)</span><span><b>إصبع يمين الشاشة</b>: النظر</span></div>`
    : `<div class="ctrl"><span><b>W A S D</b> أو الأسهم: المشي</span><span><b>Shift</b>: الجري</span><span><b>الماوس</b>: النظر (اضغط على الشاشة)</span><span><b>Esc</b>: إيقاف</span></div>`;
  card(`<div class="num">تجربة تفاعلية ثلاثية الأبعاد</div><h1>رحلة النور</h1><h2 style="font-size:22px;margin-top:-4px">الهجرة النبوية الشريفة</h2>
    <p>عِش أحداث الهجرة خطوةً بخطوة: من الإذن بالهجرة، إلى ليلة الخروج، وغار ثور، وطريق الصحراء، حتى قباء وطلوع البدر على المدينة.</p>
    <p class="note">أنتَ في هذه التجربة شاهدٌ يسير مع الأحداث. ولا يُجسَّد النبي ﷺ ولا صاحبه أبو بكر رضي الله عنه، تعظيماً وتوقيراً.</p>
    ${ctrls}
    <div class="stages">${STAGES.map((s,i)=>`<button data-i="${i}">${i+1}. ${s.title}</button>`).join('')}</div>`,
    [{label:'ابدأ الرحلة', fn:()=>loadStage(0)}]);
  overlay.querySelectorAll('.stages button').forEach(b=>b.onclick=()=>loadStage(+b.dataset.i));
}
function ending(){
  titleScreen();
  card(`<div class="num">تمّت الرحلة</div><h1>من الهجرة… بدأ التاريخ</h1>
    <p>لمّا أراد عمر بن الخطاب رضي الله عنه أن يضع للمسلمين تاريخاً، جعل بدايته <b>عام الهجرة</b>؛ لأنها الحدّ الفاصل بين الحق والباطل، وبداية قيام المجتمع المسلم.</p>
    <p>رأينا في الرحلة: إذناً من الله، وتخطيطاً محكماً، وأخذاً بالأسباب، وتضحية عليّ وأسماء وعامر وعبدالله، ويقيناً في الغار: «لا تحزن إن الله معنا»، ثم فرحاً عظيماً بطلوع البدر على المدينة.</p>
    <p class="verse">﴿إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَاجَرُوا وَجَاهَدُوا فِي سَبِيلِ اللَّهِ أُولَٰئِكَ يَرْجُونَ رَحْمَتَ اللَّهِ﴾</p>
    <p style="text-align:center;font-family:Amiri,serif;font-size:20px;color:var(--gold2)">اللهم صلِّ وسلّم على نبينا محمد</p>`,
    [{label:'العب من جديد', fn:()=>loadStage(0)},{label:'القائمة', ghost:true, fn:()=>titleScreen()}]);
}

/* ================= loop ================= */
const clock=new THREE.Clock(); let gt=0;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(), .05); gt+=dt;
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').classList.remove('on'); }
  if(subT>0){ subT-=dt; if(subT<=0) $('sub').classList.remove('on'); }
  if(state==='play' && S && !S.done){
    movePlayer(dt);
    if(S.timer!==null && S.timer!==undefined){ S.timer-=dt; const tm=Math.max(0,S.timer); $('hTimer').textContent=`${Math.floor(tm/60)}:${String(Math.floor(tm%60)).padStart(2,'0')}`; $('hTimer').classList.toggle('low',tm<15); if(S.timer<=0 && S.onTimeout){ S.onTimeout(); } }
    if(!S.done) S.update && S.update(dt,gt);
  } else if((state==='cutscene' || state==='title') && S && !S.done){ S.update && S.update(dt,gt); }
  else if(state==='card' && S && S.def && !S.done){ /* idle */ }
  world.traverse && world.children.forEach(o=>o.userData.tick && o.userData.tick(gt));
  // HUD
  if(S && S.meter!==null && S.meter!==undefined){ $('hMeterFill').style.width=(S.meter*100)+'%'; $('vign').style.boxShadow = S.meter>.05 ? `inset 0 0 ${60+S.meter*120}px rgba(255,40,20,${S.meter*.55})` : 'none'; } else $('vign').style.boxShadow='none';
  const ar=$('hArrow');
  if(S && S.target && state==='play'){
    ar.classList.remove('hidden');
    const tx=S.target.x ?? S.target.userData?.x, tz=S.target.z ?? S.target.userData?.z;
    const dx=tx-P.x, dz=tz-P.z; const fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw), rx=Math.cos(P.yaw), rz=-Math.sin(P.yaw);
    const a=Math.atan2(dx*rx+dz*rz, dx*fx+dz*fz);
    ar.querySelector('svg').style.transform=`rotate(${a}rad)`; $('hDist').textContent=Math.round(Math.hypot(dx,dz))+' م';
  } else ar.classList.add('hidden');
  applyCamera();
  renderer.render(scene,camera);
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(()=>{ titleScreen(); });
frame();
window.__game={loadStage, get state(){return state}, P, get S(){return S}, setState:(s)=>state=s};
</script>
